[package]
name = "arcaforty-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "Vault encryption, storage and import logic without any UI"
license = "MIT"

[dependencies]
aes-gcm = { version = "0.10.3", features = ["zeroize"] }
argon2 = "0.5.3"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
zeroize = { version = "1", features = ["derive", "serde"] }

[dev-dependencies]
tempfile = "3"
