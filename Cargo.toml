[workspace]
members = ["core"]

[package]
name = "arcaforty"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
description = "Local encrypted secrets vault"
license = "MIT"

[dependencies]
arcaforty-core = { path = "core" }
gpui = "0.2.2"
image = { version = "0.25", default-features = false }
resvg = { version = "0.45", default-features = false }
zeroize = "1"
unicode-segmentation = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory"] }

[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.ghash]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[build-dependencies]
embed-resource = "3.0"
